[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
markers = [
    "models: loads the real ONNX models (downloads ~150 MB once, 0 API calls) — run with -m models",
    "live: calls the real Gemini API (spends quota) — run explicitly with -m live",
]
addopts = "-m 'not models and not live'"
filterwarnings = ["ignore::DeprecationWarning:chromadb.*"]

[tool.coverage.run]
source = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"
# samples/ holds the demo codebases (including a planted prompt injection): test data
extend-exclude = ["samples"]

[tool.ruff.lint]
# S = flake8-bandit security rules; S608 flags SQL built from strings (SQL injection)
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S603"]
"eval/**" = ["S101"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]
